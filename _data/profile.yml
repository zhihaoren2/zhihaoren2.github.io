short_bio: >-
  <p>I am a postdoctoral researcher at Tsinghua University working at the intersection of civil and construction engineering, intelligent built environments, and artificial intelligence. I earned my Ph.D. in Architecture and Civil Engineering from City University of Hong Kong in June 2026.</p>
  <p>My research combines computer vision, machine learning, building performance simulation (EnergyPlus and CFD), and data-driven decision-making. My work spans occupant-centric comfort and HVAC control, intelligent ventilation, construction robotics, and AI-assisted infrastructure condition assessment.</p>


short_bio: >-
  <p>👋 Hi, I’m Zhihao Ren (任智浩), a postdoctoral researcher at Tsinghua University. My research explores the relationships between people and buildings, focusing on sustainable built environments, occupant-centric control (OCC), and virtual design and construction (VDC) to advance intelligent and efficient project delivery and built-asset performance 🚧.</p>
  <p>I earned my PhD (2026) and MSc (2021) from City University of Hong Kong, where I worked with Prof. Jung In Kim and Prof. Xin Li at the <a href="http://liimvdc.com/" target="_blank" rel="noopener noreferrer">Laboratory for Integrated Infrastructure Management (LIIM)</a>. I received my BEng from Chongqing University in 2017. I previously worked as a civil engineer at China State Construction Engineering Corporation (CSCEC).</p>

